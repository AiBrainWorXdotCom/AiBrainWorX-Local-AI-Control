name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Credential and personal-path checks
        run: python Tests/check_public_files.py
      - name: Bridge contracts
        run: python bridge/test_unreal_mcp.py
      - name: Profiles and settings service
        run: python Tests/test_control_runtime.py
      - name: Model backends, memory, updates and chat
        run: python Tests/test_desktop_features.py
      - name: Platform bridges and offline training boundaries
        run: python Tests/test_platform_training.py
      - name: Context, continuation, migration and plugin regression tests
        run: python -B -m unittest discover -s Tests -p 'test_*.py' -q
      - name: PowerShell syntax
        shell: powershell
        run: ./Tests/Check-Scripts.ps1
      - name: Client launch contract
        shell: powershell
        run: ./Tests/Check-ClientLaunch.ps1
      - name: Native workflow list selection
        shell: powershell
        run: ./Tests/Check-WorkflowCatalog.ps1
      - name: Model lifecycle and control states
        shell: powershell
        run: ./Tests/Check-ModelLifecycle.ps1
      - name: No-download setup plan
        shell: powershell
        run: ./Setup.ps1 -Plan
