name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Credential and personal-path checks
        run: python Tests/check_public_files.py
      - name: Bridge contracts
        run: python bridge/test_unreal_mcp.py
      - name: PowerShell syntax
        shell: powershell
        run: ./Tests/Check-Scripts.ps1
      - name: No-download setup plan
        shell: powershell
        run: ./Setup.ps1 -Plan
